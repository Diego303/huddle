OX:400,OY:96,TW:56,TH:28,

for(let s=0;s<4;s++){const x=this.X0+70+s*105;ctx.fillStyle=DARK?'#6b5a48':'#c9a77f';ctx.fillRect(x+6,fy-20,38,3);ctx.fillRect(x+8,fy-17,2,17);ctx.fillRect(x+40,fy-17,2,17);
const o=chars.find(c=>c.p==k&&c.slot%4==s&&!c.moving&&Math.abs(c.pos.x-x)<2&&c.pos.l==l);ctx.fillStyle='#2c2c2a';ctx.fillRect(x+18,fy-36,18,14);if(o&&o.st=='w'){ctx.globalAlpha=.6+.4*Math.sin(T*4+o.ph);ctx.fillStyle=colOf(o);ctx.fillRect(x+20,fy-34,14,10);ctx.globalAlpha=1}else if(o&&o.st=='a'){ctx.globalAlpha=.5+.5*Math.sin(T*6);ctx.fillStyle='#EF9F27';ctx.fillRect(x+20,fy-34,14,10);ctx.globalAlpha=1}}}
if(l==0){ctx.fillStyle='#888780';ctx.fillRect(this.X0+260,fy-40,2,40);ctx.beginPath();ctx.moveTo(this.X0+232,fy-34);ctx.lineTo(this.X0+261,fy-50);ctx.lineTo(this.X0+290,fy-34);ctx.closePath();ctx.fillStyle='#EF9F27';ctx.fill();for(let p=0;p<4;p++){ctx.fillStyle='#993C1D';ctx.fillRect(this.X0+30+p*55,fy-10,12,10);circ(this.X0+36+p*55,fy-16,8,'#639922')}txt(this.X0+10,fy-50,'azotea · descanso',PAL.muted,10,'left')}
if(l==5){for(let s=0;s<6;s++){ctx.fillStyle=DARK?'#5f5e5a':'#b4b2a9';ctx.fillRect(this.X0+30+s*72,fy-48,44,48);for(let r=0;r<3;r++){ctx.fillStyle=['#7F77DD','#D85A30','#1D9E75','#EF9F27'][(s+r)%4];ctx.fillRect(this.X0+34+s*72,fy-44+r*15,36,9)}}txt(this.X0+10,this.TOP+l*this.FH+18,'sótano · archivo',PAL.muted,10,'left')}
ctx.fillStyle=DARK?'#2c2c2a':'#5f5e5a';ctx.fillRect(this.LX-14,fy-44,28,44);ctx.fillStyle=DARK?'#444441':'#888780';ctx.fillRect(this.LX-1,fy-44,2,44);if(l>0&&l<5&&chars.some(c=>c.st=='a'&&c.pos.l==l&&!c.moving)){circ(this.LX-22,fy-26,3.5,'#EF9F27',.6+.4*Math.sin(T*8))}});
ctx.fillStyle=DARK?'#2c2c2a':'#444441';ctx.fillRect(this.LX-16,this.TOP+this.FH-10,2,5*this.FH+6);ctx.fillRect(this.LX+14,this.TOP+this.FH-10,2,5*this.FH+6);
chars.forEach(c=>{const inLift=Math.abs(c.pos.x-this.LX)<1&&c.moving&&c.path&&c.path[0]&&c.path[0].x==this.LX&&Math.abs(c.path[0].y-c.pos.y)>1;if(inLift){ctx.fillStyle=DARK?'#5f5e5a':'#d3d1c7';ctx.fillRect(this.LX-14,c.pos.y-44,28,46);ctx.strokeStyle=PAL.muted;ctx.strokeRect(this.LX-14,c.pos.y-44,28,46)}});
[...chars].sort((a,b)=>a.pos.y-b.pos.y).forEach(c=>{figure(c.pos.x,c.pos.y,c,1.05,c.face);c.lx=c.pos.x;c.ly=c.pos.y});chars.forEach(c=>{status(c,c.lx,c.ly-36);label(c,c.lx,c.ly+14)})}};
const SCENES={iso:ISO,torre:TWR};
function build(){seed=17;const cnt={};chars=DATA[mode].map(d=>{const k=cnt[d[1]]=(cnt[d[1]]||0)+1;return{id:d[0],p:d[1],rol:d[2],st:d[3],act:d[4],slot:k-1,ph:rnd()*6,face:1,t:2+rnd()*4,path:[],pos:{x:0,y:0,l:0}}});place()}
function place(){const SC=SCENES[scene];if(SC.init){SC.init();return}chars.forEach(c=>{const d=c.st=='a'?SC.wait(c):c.st=='p'?SC.wander(c):SC.work(c);c.pos={x:d.x,y:d.y,l:d.l};c.path=[];c.task=null;c.carry=null})}
const TR=[['w','p',c=>c.id+' terminó su tarea · se toma un respiro'],['p','w',c=>c.id+' vuelve a su puesto'],['a','w',c=>'Aprobado · '+c.id+' sigue trabajando'],['w','a',c=>c.id+' necesita tu aprobación'],['i','w',c=>c.id+' se despierta y retoma']];
function simStep(){const o=[];chars.forEach(c=>TR.forEach(t=>{if(c.st==t[0])o.push([c,t])}));if(!o.length)return;const wa=chars.filter(c=>c.st=='a').length;let p=o[Math.floor(rnd()*o.length)];if(!wa){const q=o.find(x=>x[1][1]=='a');if(q)p=q}if(wa>=2){const q=o.find(x=>x[1][0]=='a');if(q)p=q}
const[c,t]=p;c.st=t[1];c.act={w:'trabajando',p:'en pausa',a:'espera aprobación',i:'inactiva'}[c.st];const SC=SCENES[scene];if(!SC.init)onState(c,SC);addLog(t[2](c))}
function addLog(m){const h=new Date(),f=n=>String(n).padStart(2,'0');logs.unshift(`${f(h.getHours())}:${f(h.getMinutes())}:${f(h.getSeconds())}  ${m}`);logs=logs.slice(0,3);document.getElementById('log').innerHTML=logs.map((l,i)=>`<div style="opacity:${1-i*.28}">${l}</div>`).join('')}
function summary(){const n=s=>chars.filter(c=>c.st==s).length;document.getElementById('sum').innerHTML=`${SCENES[scene].name} · ${chars.length} ${mode} · <span style="color:#1D9E75">${n('w')} trabajando</span> · <span style="color:#BA7517">${n('a')} te esperan</span> · ${n('p')} en pausa · ${n('i')} inactivas`}
let last=performance.now(),simT=0;function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;T+=dt;const SC=SCENES[scene];if(SC.update)SC.update(dt);else chars.forEach(c=>think(c,dt,SC));if(sim){simT+=dt;if(simT>5){simT=0;simStep()}}SC.draw();summary();requestAnimationFrame(loop)}
function bar(){const b=document.getElementById('bar');b.innerHTML=Object.keys(SCENES).map(k=>`<button class="${k==scene?'on':''}" data-s="${k}">${SCENES[k].name}</button>`).join('')+'<span class="sep"></span>'+['sesiones','agentes'].map(m=>`<button class="${m==mode?'on':''}" data-m="${m}">${m}</button>`).join('')+`<span class="sep"></span><button class="${labels?'on':''}" data-l>etiquetas</button><button class="${sim?'on':''}" data-x>simular eventos</button>`;
b.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{scene=e.dataset.s;place();addLog('Escena: '+SCENES[scene].name);bar()});b.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{mode=e.dataset.m;build();bar()});b.querySelector('[data-l]').onclick=()=>{labels=!labels;bar()};b.querySelector('[data-x]').onclick=()=>{sim=!sim;bar()};document.getElementById('desc').textContent=SCENES[scene].desc}
const tip=document.getElementById('tip');cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*W,my=(e.clientY-r.top)/r.height*H;let best=null,bd=16;chars.forEach(c=>{const d=Math.hypot(c.sx-mx,c.sy-my);if(d<bd){bd=d;best=c}});
if(best){const st={w:['trabajando','#1D9E75'],a:['te espera','#BA7517'],p:['en pausa','#888780'],i:['inactiva','#888780']}[best.st];tip.style.display='block';tip.style.left=Math.min(r.width-170,e.clientX-r.left+12)+'px';tip.style.top=(e.clientY-r.top+12)+'px';tip.innerHTML=`<b>${best.id}</b><br><span class="mut">${best.p} · ${best.rol}</span><br><span style="color:${st[1]}">●</span> ${st[0]}<br><span class="mut">${best.task=='fetch'||best.f>0?'yendo a por contexto':best.act}</span>`}else tip.style.display='none'});cv.addEventListener('mouseleave',()=>tip.style.display='none');
build();bar();addLog('Escena cargada · '+chars.length+' '+mode);requestAnimationFrame(loop);
</script>
